name: Continuous Integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        uses: ./.github/actions/retry-step
        with:
          command: pnpm install
          max_attempts: '3'

      - name: Run Type Check and Lint
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run typecheck && pnpm run lint
          max_attempts: '2'

      - name: Run Tests
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test
          max_attempts: '2'

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        uses: ./.github/actions/retry-step
        with:
          command: pnpm install
          max_attempts: '3'

      - name: Build Web App
        run: pnpm --filter @trading-journal/web build

      - name: Type Check API Worker
        run: pnpm --filter @trading-journal/api typecheck

  dependabot-auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.state == 'open' && !github.event.repository.fork }}
    name: Auto-Merge Dependabot PR
    needs:
      - checks
      - build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Enable Auto-Merge
        uses: ./.github/actions/retry-step
        with:
          command: gh pr merge --auto --merge "$PR_URL"
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}